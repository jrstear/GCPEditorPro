<div class="smart-image" [class.fill]="autoFit">
    <div #panzoom>
        <img [src]="src" #img class="img-fluid">
    </div>
    <!-- Confirmed: crosshair; Estimate: yellow + -->
    <div #pin style="position: absolute; pointer-events: none; width: 32px; height: 32px;">
        <img *ngIf="confirmed" src="./assets/crosshair.png" width="32" height="32">
        <svg *ngIf="!confirmed" width="32" height="32" viewBox="0 0 32 32">
            <line x1="6" y1="16" x2="26" y2="16" stroke="black" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7"/>
            <line x1="16" y1="6" x2="16" y2="26" stroke="black" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7"/>
            <line x1="6" y1="16" x2="26" y2="16" stroke="#ffc107" stroke-width="3" stroke-linecap="round"/>
            <line x1="16" y1="6" x2="16" y2="26" stroke="#ffc107" stroke-width="3" stroke-linecap="round"/>
        </svg>
    </div>
    <div #cropBoxDiv style="position: absolute; pointer-events: none; display: none;
                            box-sizing: border-box; border-width: 3px; border-style: solid;"></div>
</div>
