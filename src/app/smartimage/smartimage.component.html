<div class="smart-image" [class.fill]="autoFit">
    <div #panzoom>
        <img [src]="src" #img class="img-fluid">
    </div>
    <img src="./assets/crosshair.png" width="32" height="32"
         [style.filter]="pinColor === 'green' ? 'hue-rotate(100deg) saturate(3) brightness(1.2)' : 'none'"
         style="position: absolute; pointer-events: none;" #pin>
    <div class="msg gm-style-pbc" #msg> 
        <p class="gm-style-pbt">Press SHIFT key + mouse wheel to zoom the image</p>
    </div>
</div>
